# Joular Code - Java configuration for spring-petclinic demo
# https://github.com/joular/joularcode-java

# Power data source: shared-memory ring buffer written by Joular Core.
# Joular Core must be running with --ringbuffer before starting petclinic.
power-source-type=ringbuffer

# Ring buffer path (OS-specific):
#   Linux:   /dev/shm/joularcorering
#   macOS:   /tmp/joularcorering
#   Windows: Local\JoularCoreRing  (demo.sh appends this at runtime on Windows,
#            overriding the Linux default below; Java properties escaping
#            requires Local\\JoularCoreRing in the file → reads as Local\JoularCoreRing)
joular-core-ringbuffer-path=/dev/shm/joularcorering

# Stack sampling interval in milliseconds.
# Lower = more accurate attribution, higher CPU overhead.
stack-monitoring-sample-rate=10

# Directory where result CSV files are written (relative to working directory
# when java is started — demo.sh runs java from the results/ subdirectory).
results-path=joular-code-java-results

# Filter output to spring-petclinic application methods.
# methods-power-app.csv will only contain branches matching this prefix.
# methods-power-all.csv always contains every observed branch.
methods-filtering-prefix=org.springframework.samples.petclinic
