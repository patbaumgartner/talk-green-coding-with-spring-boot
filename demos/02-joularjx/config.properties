# JoularJX configuration for spring-petclinic demo
# https://github.com/joular/joularjx

# Filter energy data to spring-petclinic application methods only.
# Energy from JDK internals called by these methods is attributed upward.
filter-method-names=org.springframework.samples.petclinic

# Write per-second power data during execution (one CSV file per second).
save-runtime-data=true
overwrite-runtime-data=false

# Required for Spring Boot: keeps the monitoring loop alive (the JVM is
# never destroyed in an application server — JoularJX must not exit early).
application-server=true

# Log level: OFF, INFO, WARNING, SEVERE
logger-level=INFO

# Power source: JoularCore stdout mode (-c cpu -i outputs numeric CPU watts).
# JoularJX starts JoularCore automatically using joular-core-path (injected
# by the demo script at runtime) and joular-core-parameters.
joular-core=true
joular-core-ring-buffer=false
joular-core-parameters=-c cpu -i
